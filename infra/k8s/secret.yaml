apiVersion: v1
kind: Secret
metadata:
  name: flowboard-secrets
  namespace: flowboard
type: Opaque
stringData:
  # CHANGE ALL OF THESE before deploying:
  #   JWT_SECRET:      openssl rand -hex 64
  #   POSTGRES_PASSWORD: openssl rand -hex 24
  #   REDIS_PASSWORD:  openssl rand -hex 24
  JWT_SECRET: "change-me-before-deploying"
  DATABASE_URL: "postgresql://flowboard:flowboard@postgres:5432/flowboard?schema=public"
  POSTGRES_PASSWORD: "flowboard"
  REDIS_PASSWORD: "flowboard"
